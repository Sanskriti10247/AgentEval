# Prometheus for the `observability` compose profile (ADR-010 A):
#   docker compose --profile observability up -d prometheus
# UI: http://127.0.0.1:9090 (bound to loopback by docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # One target per worker replica (`docker compose up -d --scale worker=3`):
  # compose's DNS answers `worker` with every container's address. The metrics
  # port is exposed on the compose network only, never published to the host.
  - job_name: worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9464
        refresh_interval: 15s
