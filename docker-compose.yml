# Local development stack. Sandbox containers are NOT compose services: the
# worker creates them on demand as siblings through the mounted Docker socket.
#
# CPU weights (ADR-008 deployment note): on a shared host, postgres, the API and
# the worker (which hosts the lease keeper and the reconciler) must not be starved
# by sandbox containers, or heartbeats and cancellations stall. They get 4x the
# Docker default weight of 1024 (`cpu_shares`); sandbox containers keep the
# default. Weights only matter under contention: they reserve nothing when idle.
x-app-env: &app-env
  AGENTEVAL_DATABASE_URL: postgresql+asyncpg://agenteval:agenteval@postgres:5432/agenteval
  AGENTEVAL_REDIS_URL: redis://redis:6379/0
  AGENTEVAL_IMAGE_ALLOWLIST: '["agenteval-sandbox:py312"]'
  AGENTEVAL_LOG_LEVEL: ${AGENTEVAL_LOG_LEVEL:-INFO}
  # Real model calls are opt-in (the API validates, the worker calls).
  AGENTEVAL_ENABLE_ANTHROPIC_PROVIDER: ${AGENTEVAL_ENABLE_ANTHROPIC_PROVIDER:-false}

services:
  postgres:
    image: postgres:16
    cpu_shares: 4096
    environment:
      POSTGRES_USER: agenteval
      POSTGRES_PASSWORD: agenteval
      POSTGRES_DB: agenteval
    ports:
      - "127.0.0.1:${AGENTEVAL_PG_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenteval -d agenteval"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AGENTEVAL_REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    cpu_shares: 4096
    environment: *app-env
    command: ["uvicorn", "agenteval_api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/packages/core", "--reload-dir", "/app/apps/api"]
    ports:
      - "127.0.0.1:${AGENTEVAL_API_HOST_PORT:-8000}:8000"
    volumes:
      - ./packages/core:/app/packages/core
      - ./apps/api:/app/apps/api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    cpu_shares: 4096
    environment:
      <<: *app-env
      AGENTEVAL_WORKER_CONCURRENCY: ${AGENTEVAL_WORKER_CONCURRENCY:-2}
      # Worker only: the key never reaches the API or any sandbox container.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # watchfiles restarts on code changes; SIGINT triggers the worker's graceful drain.
    command: ["watchfiles", "--filter", "python", "--sigint-timeout", "330",
              "python -m agenteval_worker.main",
              "/app/packages/core", "/app/apps/worker"]
    volumes:
      - ./packages/core:/app/packages/core
      - ./apps/worker:/app/apps/worker
      # Host-root equivalent: see README "Security model".
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace snapshot files (ADR-008 A); every worker mounts the same volume.
      - artifacts:/var/lib/agenteval/artifacts
    # Let in-flight runs (max timeout 300s) drain on `docker compose stop`.
    stop_grace_period: 340s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  artifacts:
