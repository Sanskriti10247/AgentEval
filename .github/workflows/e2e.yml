# Full-stack end-to-end suite against the real compose stack (ADR-012 E). Too slow for every
# push, so it runs on main, nightly and on demand.
name: E2E

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  NO_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  e2e:
    name: E2E (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages

      # `make up` builds the sandbox image, builds api and worker, and waits for health.
      - name: Start the stack
        run: |
          make up
          make migrate

      # Authentication is on by default (ADR-012 A/B). Create an admin key with the keys CLI
      # (it prints the key as its last line) and hand it to the suite as AGENTEVAL_E2E_API_KEY.
      - name: Bootstrap an API key
        run: |
          key="$(docker compose exec -T api python -m agenteval_api.keys create --name ci-e2e --scopes read,write,admin | tail -n 1)"
          case "$key" in ae_*) ;; *) echo "keys CLI did not print a key"; exit 1 ;; esac
          echo "::add-mask::${key}"
          echo "AGENTEVAL_E2E_API_KEY=${key}" >> "$GITHUB_ENV"

      # Recreates the worker with short lease timings (docker-compose.e2e.yml), then pytest.
      - name: Run the E2E suite
        run: make e2e

      - name: Dump compose logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans
